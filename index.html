<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听风播放器</title>
  </head>
  <body>
    <header class="header">
      <h1>· 听风播放器 </h1>
      <p>原生js项目</p>
    </header>

    <section class="player" id="player">
      <div class="player-cover" id="playerCover" style="--c1:#3b6df5;--c2:#8b5cf6">凌</div>
      <div class="player-info">
        <p class="player-title" id="playerTitle">还没选歌</p>
        <p class="player-artist" id="playerArtist">点歌列表里任意一首开始</p>
        <div class="progress-row">
          <input class="range seek" id="seek" type="range" min="0" max="1000" step="1"
                  value="0" aria-label="播放进度" disabled>
                  <div class="times">
                    <span id="timeNow">0:00</span>
                    <span id="timeTotal">0:00</span>
                  </div>
        </div>
        <div class="volume-row">
          <button id="muteBtn" class="mute-btn" type="button" aria-label="静音">
            <svg class="icon icon-volume" viewBox="0 0 24 24 " aria-hidden="true">
            <path d="M4 9.5h3L11 6v12l-4-3.5H4z"></path>
            </svg>
            <svg class="icon icon-muted" viewBox="0 0 24 24 " aria-hidden="true">
            <path d="M4 9.5h3L11 6v12l-4-3.5H4z"></path>
            <path d="M15 9.5l4 5M19 9.5l-4 5"  fill="none" 
                   stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
            </svg>
          </button>
           <input class="range volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8"
           aria-label="音量">
        </div>
      </div>

      <div class="player-controls">
      <button id="prevBtn" class="play-btn" type="button" aria-label="上一首">
        <svg class="icon " viewBox="0 0 24 24 " aria-hidden="true">
          <path d="M7 5v14M18 5.5v13l-9-6.5z"></path>
        </svg>
      </button>

      <button id="playBtn" class="play-btn" type="button" aria-label="播放/暂停">
        <svg class="icon icon-play" viewBox="0 0 24 24 " aria-hidden="true">
          <path d="M8 5v14l11-7z"></path>
        </svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24 " aria-hidden="true">
          <path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>
        </svg>
      </button>

      <button id="nextBtn" class="play-btn" type="button" aria-label="下一首">
        <svg class="icon " viewBox="0 0 24 24 " aria-hidden="true">
          <path d="M17 5v14M6 5.5v13l9-6.5z"></path>
        </svg>
      </button>

      <button id="loopBtn" class="ctrl-mode" type="button" data-mode="list"
      aria-label="循环模式：列表循环（点一下切换）">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3M19.5 12a7.5 7.5 0 0 1-12.8 5.3"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        <path d="M17.3 3.4v3.3h-3.3M6.7 20.6v-3.3h3.3"  fill="none" 
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span id="loopText">循环播放</span>
      </button>
      
      </div>
    </section>

    <section class="list-section">
      <h2>播放列表</h2>
      <span id="listCount">0首</span>
      <ul id="trackList" class="track-list"></ul>
    </section>

    <script type="module" src="/src/main.js"></script>
      <audio id="audio" preload="metadata"></audio>

  </body>
</html>
